name: Developer Build Deploy and Trigger QA

on:
  # Developer main branch-এ code push করলে pipeline শুরু হবে
  push:
    branches:
      - main

  # GitHub থেকে manually চালানোর সুযোগ
  workflow_dispatch:

jobs:
  # ==========================================================
  # JOB 1: BUILD
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:
      # Developer repository checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python dependencies install
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Python syntax validation
      - name: Validate Python code
        run: |
          python -m compileall app.py

      # Flask application load test
      - name: Validate Flask application
        run: |
          python -c "from app import app; print('Flask application loaded successfully')"

  # ==========================================================
  # JOB 2: DEPLOY TO VERCEL
  # ==========================================================
  deploy:
    # Build successful না হলে deploy হবে না
    needs: build

    runs-on: ubuntu-latest

    steps:
      # Repository checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Vercel CLI install
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel production deployment
      - name: Deploy to Vercel
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

  # ==========================================================
  # JOB 3: TRIGGER QA REPOSITORY
  # ==========================================================
  trigger-qa:
    # Build + Vercel deployment দুটো successful হলে QA শুরু হবে
    needs:
      - build
      - deploy

    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA Automation Repository
        uses: peter-evans/repository-dispatch@v4
        with:
          # QA repository access token
          token: ${{ secrets.QA_REPO_TOKEN }}

          # তোমার QA repository
          repository: YOUR_GITHUB_USERNAME/qa-automation-repo

          # QA workflow এই event-এর মাধ্যমে trigger হবে
          event-type: run-qa-tests

          # QA-কে প্রয়োজনীয় information পাঠানো হচ্ছে
          client-payload: >-
            {
              "base_url": "https://developer-demo-app.vercel.app/",
              "source_repo": "${{ github.repository }}",
              "commit_sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }
