name: Developer Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m compileall .
          python -c "import flask; print('Flask import successful')"

  vercel-auth:
    name: Test Vercel Authentication
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel Authentication
        run: |
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }}
