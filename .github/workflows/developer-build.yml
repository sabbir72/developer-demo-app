name: Developer Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD APPLICATION
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m compileall .
          python -c "import flask; print('Flask import successful')"

  # ==========================================
  # 2. VERCEL PULL
  # ==========================================
  vercel-pull:
    name: Pull Vercel Project
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest

      - name: Pull Vercel Project
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ==========================================
  # 3. VERCEL BUILD
  # ==========================================
  vercel-build:
    name: Build Vercel Application
    needs: vercel-pull
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------
      # Python
      # ------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------
      # Install uv
      # ------------------------------
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      # ------------------------------
      # Add uv to PATH
      # ------------------------------
      - name: Add uv to PATH
        run: |
          UV_PATH=$(python -m site --user-base)/bin
          echo "$UV_PATH" >> "$GITHUB_PATH"
          echo "UV_PATH=$UV_PATH"

      # ------------------------------
      # Verify uv
      # ------------------------------
      - name: Verify uv
        run: |
          which uv
          uv --version

      # ------------------------------
      # Node.js
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------
      # Vercel CLI
      # ------------------------------
      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest

      # ------------------------------
      # Pull Vercel Project
      # ------------------------------
      - name: Pull Vercel Project
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ------------------------------
      # Vercel Build
      # ------------------------------
      - name: Build Vercel Application
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ==========================================
  # 4. VERCEL DEPLOY
  # ==========================================
  vercel-deploy:
    name: Deploy to Vercel
    needs: vercel-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest

      - name: Pull Vercel Project
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel Application
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

